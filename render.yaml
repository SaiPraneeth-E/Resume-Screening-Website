services:
  # Python FastAPI Backend Web Service
  - type: web
    name: smart-resume-screener-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    region: oregon
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-resume-screener-db
          property: connectionString
      - key: AI_PROVIDER
        value: local
      - key: AI_API_KEY
        sync: false

  # React Vite Frontend Web Service
  - type: web
    name: smart-resume-screener-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-resume-screener-backend
          property: url

databases:
  # Managed PostgreSQL Database
  - name: smart-resume-screener-db
    databaseName: resumescreener
    user: screener_user
    region: oregon
    plan: starter
