services:
  - type: web
    name: smart-resume-screener-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-resume-screener-db
          property: connectionString
      - key: AI_PROVIDER
        value: local
      - key: AI_API_KEY
        value: ""
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: smart-resume-screener-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-resume-screener-backend
          property: host

databases:
  - name: smart-resume-screener-db
    databaseName: resumescreener
    user: screener_user
    region: oregon
    plan: free
